<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>קטגוריות | ניהול טכנוטיפים</title>
  <meta name="theme-color" content="#123B4E">
  <link rel="icon" href="/media/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin auth-pending">
  <a class="skip-link" href="#main">דילוג לתוכן הראשי</a>
  <header class="admin-header">
    <div class="admin-header__inner">
      <a class="admin-brand" href="/admin/"><span aria-hidden="true">💡</span> טכנוטיפים <span class="admin-brand__tag">ניהול</span></a>
      <nav class="admin-nav" aria-label="ניווט ניהול">
        <ul>
          <li><a href="/admin/" data-nav="dashboard">לוח בקרה</a></li>
          <li><a href="/admin/tips.html" data-nav="tips">טיפים</a></li>
          <li><a href="/admin/tip-edit.html" data-nav="new">טיפ חדש</a></li>
          <li><a href="/admin/categories.html" data-nav="categories">קטגוריות</a></li>
          <li><a href="/admin/groups.html" data-nav="groups">קבוצות הפצה</a></li>
          <li><a href="/" target="_blank" rel="noopener">לאתר <span aria-hidden="true">↗</span><span class="visually-hidden">(נפתח בחלון חדש)</span></a></li>
        </ul>
      </nav>
      <div class="admin-user">
        <span id="admin-user" class="muted"></span>
        <button type="button" id="logout" class="btn btn--small btn--secondary">יציאה</button>
      </div>
    </div>
  </header>
  <div class="auth-loader" aria-live="polite">טוען…</div>
  <main id="main" tabindex="-1" class="admin-main">
    <div class="admin-container">
      <div class="page-bar"><h1>קטגוריות</h1></div>
      <div class="two-col">
        <section class="panel" aria-labelledby="cat-list-title">
          <h2 id="cat-list-title" class="panel__title">כל הקטגוריות</h2>
          <div id="cat-list" class="table-wrap"></div>
        </section>
        <section class="panel" aria-labelledby="cat-form-title">
          <h2 id="cat-form-title" class="panel__title">קטגוריה חדשה</h2>
          <form id="cat-form" novalidate>
            <input type="hidden" id="cat-id">
            <div class="field"><label for="cat-name">שם *</label><input id="cat-name" type="text" required maxlength="60"></div>
            <div class="field"><label for="cat-slug">כתובת (slug) *</label><input id="cat-slug" type="text" required dir="ltr" maxlength="60" pattern="[a-z0-9]+(-[a-z0-9]+)*" aria-describedby="cat-slug-hint"><p class="hint" id="cat-slug-hint">אותיות באנגלית קטנות, ספרות ומקפים.</p></div>
            <div class="field"><label for="cat-desc">תיאור</label><textarea id="cat-desc" maxlength="300" rows="3"></textarea></div>
            <div class="field"><label for="cat-order">סדר תצוגה</label><input id="cat-order" type="number" min="0" step="1" value="0"></div>
            <label class="check"><input id="cat-active" type="checkbox" checked> פעילה (מוצגת באתר)</label>
            <p id="cat-error" class="field-error" role="alert"></p>
            <div class="form-actions">
              <button type="submit" class="btn btn--primary" id="cat-submit">הוספת קטגוריה</button>
              <button type="button" class="btn btn--ghost" id="cat-cancel" hidden>ביטול עריכה</button>
            </div>
          </form>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="/assets/js/admin/categories.js"></script>
</body>
</html>
