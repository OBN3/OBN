<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>משפחה ביחד – ניהול טיפול</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* (ה-CSS נשאר ללא שינוי) */
:root {
  --primary:#4f46e5; --primary-dark:#3730a3;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444; --info:#3b82f6;
  --deleted:#6b7280; --med-color:#8b5cf6;
  --bg:#f1f5f9; --surface:#fff; --surface2:#f8fafc;
  --text:#1e293b; --text2:#64748b; --border:#e2e8f0;
  --radius:14px; --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.08); --shadow-sm:0 1px 4px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl;}
button{font-family:'Heebo',sans-serif;cursor:pointer;border:none;outline:none;}
input,textarea,select{font-family:'Heebo',sans-serif;outline:none;direction:rtl;}

#offlineBanner{
  display:none;position:fixed;top:0;left:0;right:0;z-index:99999;
  background:#f59e0b;color:#fff;padding:10px 20px;
  text-align:center;font-size:.9rem;font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  align-items:center;justify-content:center;gap:8px;
}
#offlineBanner.show{display:flex;}
#offlineBanner.online{background:var(--success);}

#loadingOverlay{position:fixed;inset:0;background:rgba(241,245,249,.96);z-index:9999;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#loadingOverlay.hidden{display:none;}
.spinner{width:44px;height:44px;border:4px solid var(--border);
  border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="offlineBanner">
  <span id="offlineBannerText">⚠️ אין חיבור לאינטרנט – האפליקציה פועלת במצב לא מקוון</span>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <p style="color:#64748b;font-size:.95rem;">טוען נתונים...</p>
</div>

<div id="loginScreen" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);padding:24px;">
  <div style="background:#fff;border-radius:24px;padding:48px 40px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.18);">
    <div style="font-size:4rem;margin-bottom:16px;">👨‍👩‍👦</div>
    <h1 style="font-size:2rem;font-weight:800;color:var(--primary);margin-bottom:8px;">משפחה ביחד</h1>
    <p style="color:var(--text2);margin-bottom:32px;">ניהול משימות וטיפול משותף עבור המשפחה</p>
    <button id="googleSignIn" style="display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;border:2px solid var(--border);border-radius:12px;padding:14px 28px;font-size:1rem;font-weight:600;color:var(--text);width:100%;cursor:pointer;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" style="width:24px;height:24px;"/>
      כניסה עם חשבון Google
    </button>
  </div>
</div>

<div id="app" style="display:none;">
    <!-- Rest of app HTML (Omitted for brevity to prevent script crash, only updating core JS) -->
    <h1>האפליקציה נטענה בהצלחה (HTML מקוצר לצורך קובץ ההדגמה)</h1>
    <button id="signOut">יציאה</button>
</div>

<div id="toastContainer"></div>

<!-- Firebase Compat 10.7.1 -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyDn9MNktFcHxzwxL5hhIYPIIN635_0pST8",
  authDomain:        "obn-photocontest.firebaseapp.com",
  projectId:         "obn-photocontest",
  storageBucket:     "obn-photocontest.firebasestorage.app",
  messagingSenderId: "833616633042",
  appId:             "1:833616633042:web:82339189ba55f3d916210b"
};
const FAMILY_ID = "family_main"; // שנה בהתאם לזיהוי המשפחה שלך

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db   = firebase.firestore();

const googleProvider = new firebase.auth.GoogleAuthProvider();
const $ = id => document.getElementById(id);

function showLoading() { $("loadingOverlay").classList.remove("hidden"); }
function hideLoading() { $("loadingOverlay").classList.add("hidden"); }

// גיבוי: העלמת מסך הטעינה בכוח לאחר 5 שניות במקרה של תקיעה בטעינה
setTimeout(hideLoading, 5000);

$("googleSignIn").addEventListener("click", () =>
  auth.signInWithPopup(googleProvider)
    .catch(e => alert("שגיאת כניסה: " + e.message)));

$("signOut").addEventListener("click", () => auth.signOut());

// הפונקציה החשובה המעודכנת
auth.onAuthStateChanged(async (user) => {
  if (user) {
    showLoading(); // מפעילים מסך טעינה מיד 

    try {
      // 1. קריאת רשימת המורשים מ-Firestore
      const permDoc = await db.collection("families").doc(FAMILY_ID).collection("settings").doc("permissions").get();
      let allowedEmails = [];
      
      if (permDoc.exists) {
        allowedEmails = permDoc.data().emails || [];
      } else {
        // רשימת גיבוי זמנית עד שתיצור את המסמך
        allowedEmails = ["veredt9@gmail.com", "brother2@gmail.com", "ofirbn@gmail.com"];
      }

      // 2. אימות המייל
      if (!allowedEmails.includes(user.email)) {
        hideLoading();
        alert("❌ אינך מורשה לגשת לאפליקציה זו.");
        auth.signOut();
        return;
      }
      
      // 3. אישור וטעינת האפליקציה
      $("loginScreen").style.display = "none";
      $("app").style.display = "flex";
      hideLoading();
      
      // כאן יקראו שאר הפונקציות לטעינת נתונים... (loadTasks, loadExpenses וכו')

    } catch (error) {
      hideLoading();
      console.error("Permissions check failed:", error);
      alert("שגיאה בבדיקת הרשאות גישה.");
      auth.signOut();
    }
  } else {
    hideLoading(); // ⚠️ התיקון הקריטי שהוספנו למניעת מסך שחור
    $("loginScreen").style.display = "flex";
    $("app").style.display = "none";
  }
});
</script>
</body>
</html>
